app:
  name: "LMSS"
  version: "1.0.3-clover"
  debug: true
  env: "development"
  banner_path: "banner.txt"
  startup_delay: 3                # seconds to display boot screen (0 to skip)
  enable_tui: false                # enable fancy TUI mode (false = traditional console logging)

server:   
  port: "8080"
  services_endpoint: /api/v1      # endpoint service path

services:
  mongodb_service: true
  multi_tenant_service: true
  auth_service: true
  reports_service: true
  catalog_service: true
  patrons_service: true
  circulation_service: true
  fines_service: true
  reservations_service: true

# Middleware configuration - enable/disable middlewares (defaults to true if not specified)
middleware:
  request_id: true
  logger: true
  permission_check: true
  cors: true
  jwt: true           # JWT authentication for LMSS
  ratelimit: true
  security: true
  audit: true
  encryption: false
  gzip: true
  swagger: true

auth:
  type: "jwt"
  secret: "lmss-development-secret"

postgres:
  enabled: true
  connections:
    - name: "primary"
      enabled: true
      host: "localhost"
      port: 5432
      user: "postgres"
      password: "Mypostgres01"
      dbname: "postgres"
      sslmode: "disable"

    - name: "secondary"
      enabled: true
      host: "localhost"
      port: 5433
      user: "postgres"
      password: "Mypostgres01"
      dbname: "postgres"
      sslmode: "disable"

mongo:
  enabled: true
  connections:
    - name: "primary"
      enabled: true
      uri: "mongodb://localhost:27017"
      database: "primary_db"

    - name: "secondary"
      enabled: true
      uri: "mongodb://localhost:27018"
      database: "secondary_db"

cron:
  enabled: true
  jobs:
    log_cleanup: "0 0 * * *"
    health_check: "*/10 * * * * *" # Every 10 seconds

encryption:
  enabled: false
  algorithm: "aes-256-gcm"
  key: ""

frontend:
  enabled: true
  path: "/"

plugins:
  enabled: true
  default_limits:
    max_timeout_ms: 30000
    max_memory_bytes: 104857600
  # allowlist: []
